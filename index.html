<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080a0f"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg"><link rel="stylesheet" href="styles.css"><title>Calc</title></head><body><main class="app"><header><div class="brand"><img src="icons/icon.svg" alt=""><div><b>Calc</b><small>Calculator</small></div></div><div class="modes"><button type="button" class="mode active" id="normalMode" onclick="switchMode('normal')">通常</button><button type="button" class="mode" id="fractionMode" onclick="switchMode('fraction')">分数</button></div></header><div class="screens" id="screens"><section class="screen normal-screen"><div class="display"><div class="display-label">通常</div><div id="expr">0</div><div id="preview"></div></div><div id="normal" class="pad"><button type="button" class="soft" data-a="clear">AC</button><button type="button" class="soft" data-a="paren">( )</button><button type="button" class="soft" data-a="percent">%</button><button type="button" class="operator" data-v="÷">÷</button><button type="button" data-v="7">7</button><button type="button" data-v="8">8</button><button type="button" data-v="9">9</button><button type="button" class="operator" data-v="×">×</button><button type="button" data-v="4">4</button><button type="button" data-v="5">5</button><button type="button" data-v="6">6</button><button type="button" class="operator" data-v="−">−</button><button type="button" data-v="1">1</button><button type="button" data-v="2">2</button><button type="button" data-v="3">3</button><button type="button" class="operator" data-v="+">+</button><button type="button" class="zero" data-v="0">0</button><button type="button" data-v=".">.</button><button type="button" class="equals" data-a="equals">=</button><button type="button" class="delete" data-a="delete">⌫</button></div></section><section class="screen fraction-screen"><div class="display fraction-display"><div class="display-label">分数</div><div id="fractionPreview">タップして入力</div><div id="fractionResult"></div></div><div class="fraction-toolbar"><button type="button" data-fa="add">＋ 分数</button><button type="button" data-fa="mixed">帯分数</button><button type="button" data-fa="clear">AC</button></div><div class="hint">分子・分母・整数・演算子をタップして選択</div><div id="fracs"></div><div class="pad fractionPad"><button type="button" class="soft" data-fa="clear">AC</button><button type="button" class="operator" data-fv="÷">÷</button><button type="button" class="operator" data-fv="×">×</button><button type="button" class="operator" data-fv="−">−</button><button type="button" data-fv="7">7</button><button type="button" data-fv="8">8</button><button type="button" data-fv="9">9</button><button type="button" class="operator" data-fv="+">+</button><button type="button" data-fv="4">4</button><button type="button" data-fv="5">5</button><button type="button" data-fv="6">6</button><button type="button" class="soft" data-fa="delete">⌫</button><button type="button" data-fv="1">1</button><button type="button" data-fv="2">2</button><button type="button" data-fv="3">3</button><button type="button" class="soft" data-fa="deleteFrac">分数削除</button><button type="button" class="zero" data-fv="0">0</button><button type="button" class="equals" data-fa="equals">=</button></div></section></div></main><script>function switchMode(mode){var s=document.getElementById('screens');var n=document.getElementById('normalMode');var f=document.getElementById('fractionMode');var active=mode==='fraction';s.classList.toggle('fraction-active',active);n.classList.toggle('active',!active);f.classList.toggle('active',active);n.setAttribute('aria-selected',String(!active));f.setAttribute('aria-selected',String(active));}</script><script src="app.js?v=7" defer></script></body></html>
