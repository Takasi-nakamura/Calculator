<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080a0f"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg"><link rel="stylesheet" href="styles.css"><title>Calc</title></head><body><main class="app"><header><div class="brand"><img src="icons/icon.svg" alt=""><div><b>Calc</b><small>Calculator</small></div></div><div class="modes"><button type="button" class="mode active" id="normalMode" onclick="switchMode('normal')">通常</button><button type="button" class="mode" id="fractionMode" onclick="switchMode('fraction')">分数</button></div></header><div class="screens" id="screens"><section class="screen normal-screen"><div class="display"><div class="display-label">通常</div><div id="expr">0</div><div id="preview"></div></div><div class="pad"><button type="button" onclick="N.clear()">AC</button><button type="button" onclick="N.paren()">( )</button><button type="button" onclick="N.percent()">%</button><button type="button" onclick="N.input('÷')">÷</button><button type="button" onclick="N.input('7')">7</button><button type="button" onclick="N.input('8')">8</button><button type="button" onclick="N.input('9')">9</button><button type="button" onclick="N.input('×')">×</button><button type="button" onclick="N.input('4')">4</button><button type="button" onclick="N.input('5')">5</button><button type="button" onclick="N.input('6')">6</button><button type="button" onclick="N.input('−')">−</button><button type="button" onclick="N.input('1')">1</button><button type="button" onclick="N.input('2')">2</button><button type="button" onclick="N.input('3')">3</button><button type="button" onclick="N.input('+')">+</button><button type="button" class="zero" onclick="N.input('0')">0</button><button type="button" onclick="N.input('.')">.</button><button type="button" class="equals" onclick="N.equals()">=</button><button
