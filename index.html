<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><meta name="description" content="シンプルでモダンな電卓"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>Calculator</title></head><body><main class="app"><section class="calculator"><header class="topbar"><span class="brand">Calculator</span><button id="fractionToggle" class="mode-button" type="button">分数</button></header><section class="display"><div id="expression" class="expression">0</div><div id="preview" class="preview"></div></section><section id="normalPad" class="pad"><button data-key="AC">AC</button><button data-key="±">±</button><button data-key="%">%</button><button data-key="÷" class="operator">÷</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="×" class="operator">×</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="−" class="operator">−</button><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="+" class="operator">+</button><button data-key="0" class="zero">0</button><button data-key=".">.</button><button data-key="⌫" class="delete">⌫</button><button data-key="=" class="equals">=</button></section><section id="fractionPad" class="fraction-pad hidden"><div id="fractionExpression" class="fraction-expression"></div><div id="fractionInputArea" class="fraction-input-area"></div><div class="fraction-toolbar"><button data-fop="add">＋</button><button data-fop="sub">−</button><button data-fop="mul">×</button><button data-fop="div">÷</button></div><div class="fraction-actions"><button id="fractionClear">AC</button><button id="fractionDelete" class="delete">⌫</button><button id="fractionEquals" class="equals">=</button></div><p class="fraction-hint">分数を追
